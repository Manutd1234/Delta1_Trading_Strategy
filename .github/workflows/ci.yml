name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project declares >=3.11, so 3.11 must actually be exercised.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: delta1-strategy --help
      - run: python -m unittest discover -s tests -v

  integration:
    # The licensed history cannot be redistributed, so the end-to-end tests
    # skip themselves when it is absent -- which, without this job, is always.
    # The suite would stay green while the leakage proof went unexercised.
    # Synthetic data in the vendor layout makes the guarantee testable here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/make_synthetic_data.py --output-dir /tmp/synthetic
      - name: Full pipeline and causality invariants on synthetic data
        env:
          DELTA1_DATA_DIR: /tmp/synthetic
        run: |
          python -m unittest \
            tests.test_strategy.TestSuppliedDataIntegration -v
      - name: Canonical run end to end
        run: |
          python -m delta1_strategy.cli --help >/dev/null || true
          delta1-strategy --data-dir /tmp/synthetic \
            --output-dir /tmp/synthetic-outputs \
            --bootstrap-samples 200 --trade-sequence-samples 200 --skip-stress

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
