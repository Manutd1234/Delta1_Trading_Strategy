[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta1-trading-strategy"
version = "2.6.0"
description = "Optimized global trend and basis-momentum futures strategy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "nbformat>=5.10",
]

[project.scripts]
delta1-strategy = "strategy:main"

[tool.setuptools]
py-modules = ["strategy"]
