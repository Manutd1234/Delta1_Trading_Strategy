[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta1-trading-strategy"
version = "3.2.1"
description = "Best available hardened global futures trend and basis strategy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "nbformat>=5.10",
]
dev = [
  "ruff>=0.6",
]

[project.scripts]
delta1-strategy = "delta1_strategy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = [
  "E501",
  "B905",
  "SIM108",
  # Every such default in this codebase is a frozen dataclass, so the shared
  # mutable default this rule guards against cannot occur, and naming the
  # convention in the signature documents it better than a None sentinel.
  "B008",
  # The episode builder closes over the loop symbol but is called only within
  # that iteration, so the late-binding hazard never materialises.
  "B023",
  # Suppressing an exception around an optional artifact read is clearer as an
  # explicit try/except than as a contextlib import.
  "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E731"]
