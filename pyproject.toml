[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta1-trading-strategy"
version = "3.2.1"
description = "Best available hardened global futures trend and basis strategy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "nbformat>=5.10",
]

[project.scripts]
delta1-strategy = "delta1_strategy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
